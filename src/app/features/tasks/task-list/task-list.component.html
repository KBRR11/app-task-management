<div class="task-container">
    <mat-toolbar color="primary">
        <span>Task Management</span>
        <span class="spacer"></span>
        <button mat-icon-button (click)="logout()" aria-label="Logout">
            <mat-icon>exit_to_app</mat-icon>
        </button>
    </mat-toolbar>

    <div class="content">
        <div class="header-actions">
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>Search tasks</mat-label>
                <input matInput (input)="onSearch($event)" placeholder="Search by title or description">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>

            <div class="filter-buttons">
                <mat-button-toggle-group [value]="filterType">
                    <mat-button-toggle value="all" (click)="onFilterChange('all')">All</mat-button-toggle>
                    <mat-button-toggle value="pending" (click)="onFilterChange('pending')">Pending</mat-button-toggle>
                    <mat-button-toggle value="completed"
                        (click)="onFilterChange('completed')">Completed</mat-button-toggle>
                </mat-button-toggle-group>
            </div>

            <button mat-raised-button color="accent" (click)="addTask()">
                <mat-icon>add</mat-icon> Add Task
            </button>
        </div>

        <div *ngIf="loading" class="spinner-container">
            <mat-spinner></mat-spinner>
        </div>

        <div *ngIf="!loading">
            <div *ngIf="filteredTasks.length === 0" class="no-tasks">
                <p>No tasks found. Add a new task to get started.</p>
            </div>

            <mat-card *ngFor="let task of filteredTasks" class="task-card">
                <mat-card-header>
                    <mat-card-title class="task-title">
                        <mat-checkbox [checked]="task.completed" (change)="toggleTaskCompletion(task)" color="primary"
                            class="task-checkbox">
                        </mat-checkbox>
                        <span [class.completed]="task.completed">{{ task.title }}</span>
                    </mat-card-title>
                    <mat-card-subtitle>Created: {{ formatDate(task.createdAt) }}</mat-card-subtitle>
                </mat-card-header>

                <mat-card-content>
                    <p [class.completed]="task.completed">{{ task.description }}</p>
                </mat-card-content>

                <mat-card-actions align="end">
                    <button mat-icon-button color="primary" (click)="editTask(task)" aria-label="Edit task">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteTask(task)" aria-label="Delete task">
                        <mat-icon>delete</mat-icon>
                    </button>
                </mat-card-actions>
            </mat-card>
        </div>
    </div>
</div>
