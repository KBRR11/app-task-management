<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Create New Task' : 'Edit Task' }}</h2>

<form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Title</mat-label>
            <input matInput formControlName="title" placeholder="Enter task title">
            <mat-error *ngIf="taskForm.get('title')?.hasError('required')">
                Title is required
            </mat-error>
            <mat-error *ngIf="taskForm.get('title')?.hasError('maxlength')">
                Title cannot exceed 100 characters
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" placeholder="Enter task description" rows="4">
      </textarea>
            <mat-error *ngIf="taskForm.get('description')?.hasError('required')">
                Description is required
            </mat-error>
        </mat-form-field>

        <mat-checkbox formControlName="completed" color="primary" class="completed-checkbox">
            Mark as completed
        </mat-checkbox>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button type="button" mat-button (click)="onCancel()">Cancel</button>
        <button type="submit" mat-raised-button color="primary" [disabled]="taskForm.invalid || loading">
            <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
            <span *ngIf="!loading">{{ data.mode === 'create' ? 'Create' : 'Update' }}</span>
        </button>
    </mat-dialog-actions>
</form>
